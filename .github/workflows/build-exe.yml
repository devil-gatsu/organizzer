name: Build organizzer EXE

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build single-file EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon "assets/icon.ico" --add-data "assets/icon.ico;assets" --name "organizzer" main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: organizzer-windows-exe
          path: dist/organizzer.exe

      - name: Publish Release asset on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/organizzer.exe
